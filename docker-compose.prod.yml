version: '3.8'

services:
  backend:
    image: registry.digitalocean.com/your-username/minerva-registry/backend:latest
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=minervahome.settings_prod
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DEBUG=False
    volumes:
      - backend_static:/app/static
      - backend_media:/app/media
    depends_on:
      - db
      - redis
    networks:
      - minerva-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health/']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: registry.digitalocean.com/your-username/minerva-registry/frontend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - frontend_static:/app/.next
    networks:
      - minerva-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    external: true # Use managed database
    networks:
      - minerva-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - minerva-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/var/www/static:ro
      - frontend_static:/var/www/frontend:ro
    depends_on:
      - backend
      - frontend
    networks:
      - minerva-network

volumes:
  backend_static:
    driver: local
  backend_media:
    driver: local
  frontend_static:
    driver: local
  redis_data:
    driver: local

networks:
  minerva-network:
    driver: bridge
