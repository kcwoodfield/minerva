version: '3.8'

services:
  # Override backend for development
  backend:
    build:
      target: development
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=minervahome.settings
      - DATABASE_URL=postgresql://minerva_user:minerva_password@db:5432/minerva
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - backend_media:/app/media
    command: python manage.py runserver 0.0.0.0:8000

  # Override frontend for development
  frontend:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Development database with more verbose logging
  db:
    environment:
      - POSTGRES_DB=minerva
      - POSTGRES_USER=minerva_user
      - POSTGRES_PASSWORD=minerva_password
    command: postgres -c log_statement=all -c log_min_duration_statement=0

  # Development Redis with persistence disabled for faster startup
  redis:
    command: redis-server --appendonly no --save ""
