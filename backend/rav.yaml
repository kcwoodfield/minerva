scripts:
  server:
    - python manage.py runserver 8000
  makemigrations:
    - python manage.py makemigrations
  migrate:
    - python manage.py migrate
  shell:
    - python manage.py shell
  curl_auth: |
    curl -X POST -H "Content-Type: application/json" -d '{"username": "kcw", "password": "password"}' http://127.0.0.1:8000/api/token/pair
  curl_protect: |
    curl -X GET -H "Authorization: Bearer <the-curl_auth-access-token-here>" http://127.0.0.1:8000/api/user
