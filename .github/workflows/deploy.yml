name: Deploy to Digital Ocean

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

env:
  REGISTRY: registry.digitalocean.com/your-username/minerva-registry
  IMAGE_NAME: minerva

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Run Backend Tests
        run: |
          cd backend
          python manage.py test

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
            echo "TAG=staging" >> $GITHUB_OUTPUT
          fi

      - name: Login to Digital Ocean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DIGITAL_OCEAN_REGISTRY_URL }}
          username: ${{ secrets.DIGITAL_OCEAN_REGISTRY_USERNAME }}
          password: ${{ secrets.DIGITAL_OCEAN_REGISTRY_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ steps.set-env.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ steps.set-env.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage'

    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIGITAL_OCEAN_DROPLET_IP }}
          username: minerva
          key: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}
          script: |
            # Set environment variables
            export ENVIRONMENT="${{ steps.set-env.outputs.ENVIRONMENT }}"
            export TAG="${{ steps.set-env.outputs.TAG }}"

            # Pull latest images
            docker-compose -f /home/minerva/docker-compose.prod.yml pull

            # Deploy with zero downtime
            docker-compose -f /home/minerva/docker-compose.prod.yml up -d

            # Health check
            sleep 30
            if ! curl -f http://localhost/health; then
              echo "Deployment failed health check"
              exit 1
            fi

            echo "Deployment successful for $ENVIRONMENT"
